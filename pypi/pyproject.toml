[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgepack"
version = "3.0.0"
description = "ForgePack - Native Rust single-file Windows installer builder compatible with Inno Setup (.iss) scripts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "ForgePack", email = "yangdw2021@gmail.com" }]
keywords = ["installer", "setup", "inno-setup", "windows", "packaging", "rust", "forgepack"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/yangdw2024/trae-installer-creator"
Repository = "https://github.com/yangdw2024/trae-installer-creator"

[project.scripts]
forgecc = "trae_installer.cli:main_cc"
forge-studio = "trae_installer.cli:main_studio"

[tool.setuptools.packages.find]
include = ["trae_installer*"]

[tool.setuptools.package-data]
trae_installer = ["bin/*.exe"]
