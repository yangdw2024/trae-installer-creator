[workspace]
resolver = "2"
members = [
    "crates/trae-core",
    "crates/trae-stub",
    "crates/traecc",
    "crates/trae-studio",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
authors = ["Trae"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.5"
flate2 = "1.1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
walkdir = "2.5.0"
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = false
incremental = false
codegen-units = 1

[profile.test]
debug = false
incremental = false
codegen-units = 1

[profile.release]
opt-level = "z"
lto = false
incremental = false
codegen-units = 1
panic = "abort"
strip = true
